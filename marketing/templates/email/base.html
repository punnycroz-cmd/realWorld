<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>Real World — The Mission</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
</head>
<body style="margin:0;padding:0;background:#f4f2ec;">
<!-- Preheader: the second line people read. Always write it. -->
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
  {{preheader}}&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;
</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f2ec;">
<tr><td align="center" style="padding:24px 12px;">

  <!-- Header: dark-ink lockup on light. Text fallback carries it when images are blocked. -->
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;">
    <tr>
      <td style="padding:8px 24px 20px;">
        <img src="{{asset_base}}logo-primary-dark.svg" width="180" height="54" alt="REAL WORLD — THE MISSION" style="display:block;border:0;">
      </td>
    </tr>

    <!-- Body card -->
    <tr>
      <td style="background:#ffffff;border:1px solid #e3ded2;border-radius:10px;padding:32px 28px;">
        <!-- BODY:START — replace this block only -->
        <h1 style="margin:0 0 14px;font:700 24px/1.25 -apple-system,Segoe UI,Roboto,sans-serif;color:#14161c;">
          {{headline}}
        </h1>
        <p style="margin:0 0 16px;font:400 16px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;color:#3a3d47;">
          {{body_copy}}
        </p>
        <!-- One amber element per email. -->
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:22px 0 6px;">
          <tr>
            <td style="background:#e8a04c;border-radius:8px;">
              <a href="{{cta_url}}" style="display:inline-block;padding:13px 26px;font:700 16px/1 -apple-system,Segoe UI,Roboto,sans-serif;color:#1a1206;text-decoration:none;">{{cta_label}}</a>
            </td>
          </tr>
        </table>
        <!-- BODY:END -->
      </td>
    </tr>

    <!-- Footer: why they got it + out. No guilt copy. -->
    <tr>
      <td style="padding:22px 24px;font:400 12px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;color:#8a8d97;">
        <p style="margin:0 0 8px;">{{reason_line}} — you're getting this because {{reason}}.</p>
        <p style="margin:0 0 8px;">Real World — The Mission · [STUDIO NAME] · [POSTAL LINE]</p>
        <p style="margin:0;"><a href="{{unsubscribe}}" style="color:#8a8d97;text-decoration:underline;">Unsubscribe</a> · <a href="{{preferences_url}}" style="color:#8a8d97;text-decoration:underline;">Email preferences</a></p>
      </td>
    </tr>
  </table>

</td></tr>
</table>
</body>
</html>
