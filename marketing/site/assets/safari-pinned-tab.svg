    <rect x="206" y="128" width="4" height="302" fill="#000" stroke="none"/>
    <rect x="306" y="128" width="4" height="302" fill="#000" stroke="none"/>
    <rect x="124" y="158" width="64" height="72" rx="8" stroke-width="8"/>
