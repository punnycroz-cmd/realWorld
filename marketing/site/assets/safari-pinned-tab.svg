    <rect x="124" y="354" width="64" height="72" rx="8" stroke-width="8"/>
    <rect x="224" y="158" width="64" height="72" rx="8" stroke-width="8"/>
    <rect x="224" y="354" width="64" height="72" rx="8" stroke-width="8"/>
    <rect x="324" y="158" width="64" height="72" rx="8" stroke-width="8"/>
