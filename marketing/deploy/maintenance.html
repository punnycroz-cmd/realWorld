<!DOCTYPE html>
<!-- maintenance.html — static "back soon" page for rollback/maintenance mode.
     Lives in deploy/ (NOT site/) so it never ships in a normal deploy.
     Enable: Caddyfile maintenance block — one comment flip, see
     deploy/README.md. Self-contained: inline styles, zero asset deps, so it
     renders even if the release dir is broken. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back soon — Real World</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10131a;color:#e8e4da;font-family:Georgia,'Times New Roman',serif}
  main{max-width:34em;padding:2rem;text-align:center}
  h1{font-size:1.6rem;letter-spacing:.12em;text-transform:uppercase;font-weight:400}
  p{line-height:1.6;color:#b8b2a4}
  .sig{font-size:.8rem;letter-spacing:.2em;color:#6f6a5e;text-transform:uppercase;margin-top:2.5rem}
</style>
</head>
<body>
<main>
  <h1>Real World</h1>
  <p>The block is taking a short intermission. The residents are still
  living their lives — we'll reopen the window shortly.</p>
  <p class="sig">The Mission &middot; scheduled maintenance</p>
</main>
</body>
</html>
