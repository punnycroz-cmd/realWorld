<style>

  body{margin:0;font:14px/1.5 'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg)}

  .rail .who{display:flex;gap:10px;align-items:center;width:100%;text-align:left;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;color:var(--ink);font:inherit}

  .who .init{font-family:var(--mono);font-weight:700;width:34px;height:34px;border-radius:50%;

  .who .rl{font-size:11px;color:var(--dim)}
  .railnote{font-size:11px;color:var(--dim);padding:4px 2px 0}

  /* ---- cast card ---- */
  .cardhead{display:flex;gap:16px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:14px;flex-wrap:wrap}
  .biginit{font-family:var(--mono);font-size:22px;font-weight:700;width:64px;height:64px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--acc);flex:none}
  .cardhead h3{margin:0;font-size:20px}
  .cardhead .arch{color:var(--pink);font-size:12.5px;font-style:italic}
  .facts{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:4px}
  .facts b{color:var(--ink);font-weight:600}
  .ban{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--red);border:1px solid var(--red);border-radius:10px;padding:3px 12px;align-self:center;white-space:nowrap}

  .profile{border-left:3px solid var(--acc);padding:6px 14px;font-size:14.5px;font-style:italic;color:var(--ink);background:var(--panel2);border-radius:0 6px 6px 0;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
  .lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 6px}
  .look{font-size:13px;color:var(--ink)}
  .voice{font-size:13px}
  .samp{font-family:var(--mono);font-size:12px;color:var(--blu);padding:3px 0}
  .samp::before{content:"“"}.samp::after{content:"”"}
  .mann{list-style:none;margin:0;padding:0}
  .mann li{font-size:12.5px;padding:4px 0 4px 16px;position:relative;border-bottom:1px dotted var(--line)}
  .mann li::before{content:"◦";position:absolute;left:2px;color:var(--acc)}
  .ties{list-style:none;margin:0;padding:0}
  .ties li{font-size:13px;padding:4px 0;border-bottom:1px dotted var(--line)}
  .ties b{color:var(--acc);font-weight:600}
  .rout{width:100%;border-collapse:collapse;font-size:12px}
  .rout td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  .rout td:first-child{font-family:var(--mono);color:var(--dim);white-space:nowrap;width:118px}
  .locked{border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--dim);margin-top:14px}
  .locked .lk{font-size:20px;letter-spacing:.2em}
  .locked p{font-size:12px;max-width:520px;margin:8px auto 0}
  .src{font-size:11px;color:var(--dim);text-align:center;margin-top:10px;font-family:var(--mono)}
</style>

 strg:"Instant warmth with a nickname — 'fam', 'coach', 'professor' — and he means it. Newcomers get the tour whether they asked or not.",want:["the rent handled — it's being handled, there's a timeline — plus Thursday, and one honest conversation he keeps not having","to say the true thing out loud before it says itself","music that pays; or a life where it doesn't have to"],priv:[["Priya","his favorite person and the proof of his best self; the jury whose verdict counts"],["Dani","the bright spot — he buys her sketches 'for a friend' and knows how thin the folder is"],["Victor","the landlord who likes him; the ledger is coming due and he's pretending it isn't"],["Marisol","sees through him fondly; he dreads it and relies on it equally"],["Tomás","drum-circle friend; the only man quieter about his business than Marcus"],["Carmen","feeds him; he pretends he earned it, she pretends he did"],["Jules","'Priya's coworker kid' — forgettable, which is starting to feel like a miss"]],trth:"Doesn't lie so much as reschedule the truth — 'it's being handled' is a promise about a future conversation. Cornered, he tells everything at once, badly, then cooks. Tell: the charm rises exactly as high as the thing he's avoiding.",mny:"Generous past his means — the last $20 goes to tip jars, rounds, street musicians. A mental ledger he refuses to open. Talks about money as weather.",aln:"Practice pad at the hour he should sleep. Rides the delivery route at night with no packages. Texts written and deleted like a fill.",edg:"Slow to anger, real when it lands — disrespect to Priya, stiffing a street musician. Forgives nearly anything aimed at him. No grudges kept — he just stops showing up.",day:["Thursday — the circle holding a groove, a dry route, rent actually handled","a door he used to stop at, a balance that can't be rescheduled, Priya's non-peace quiet, a rained-out Thursday"],keep:["the funk band's one flyer, framed badly — story included","a church-kit drumstick, split and taped, living with the good sticks","a framed Dani sketch bought 'for a friend,' never delivered"],lst:"hears the rhythm before the words — nods on the beat, finishes your sentence wrong but warmly. Lean-in sign: the tapping stops",offd:"routeless riding — same streets, no packages; a record-store hour called research; one coffee nursed for sixty minutes on a park bench",rpr:"cooks — the apology is a plate left at your spot; the words trail the food by a day, said to a sink. Accepts with instant relief and a too-fast joke"},

const rail=document.getElementById("rail"),card=document.getElementById("card");
function render(c){
  card.innerHTML=`
  <div class="cardhead">
    <div class="biginit">${c.init}</div>
    <div><h3>${c.name}</h3><div class="arch">${c.arch}</div>
    <div class="facts"><b>${c.age}</b> · ${c.job} · <b>${c.home}</b></div></div>

  </div>
  <div class="profile">${c.prof}</div>
  <p class="lbl">Where they come from</p><p class="look" style="margin-bottom:14px">${c.back}</p>
  <div class="grid2">
    <div><p class="lbl">Look</p><p class="look">${c.look}</p>
      <p class="lbl" style="margin-top:12px">Voice — what you'll hear</p><p class="voice">${c.voice}</p>
      ${c.samp.map(s=>`<div class="samp">${s}</div>`).join("")}</div>
    <div><p class="lbl">Habits you'll notice</p><ul class="mann">${c.mann.map(m=>`<li>${m}</li>`).join("")}</ul>
      <p class="lbl" style="margin-top:12px">Who they are to each other</p>
      <ul class="ties">${c.ties.map(t=>`<li><b>${t[0]}</b> — ${t[1]}</li>`).join("")}</ul></div>
  </div>
  <div class="grid2" style="margin-top:14px">
    <div><p class="lbl">Where they live — what the camera sees</p><p class="look">${c.room}</p></div>
    <div><p class="lbl">New to the block? Here's what you get</p><p class="look">${c.strg}</p></div>
  </div>
  <div class="grid2" style="margin-top:14px">
    <div><p class="lbl">What they want — three clocks</p>
      <table class="rout">${[["this week",c.want[0]],["this season",c.want[1]],["the long one",c.want[2]]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div>
    <div><p class="lbl">The truth, as they handle it</p><p class="look">${c.trth}</p>
      <p class="lbl" style="margin-top:12px">Who the others are — privately</p>
      <ul class="ties">${c.priv.map(t=>`<li><b>${t[0]}</b> — ${t[1]}</li>`).join("")}</ul></div>
  </div>
  <div class="grid2" style="margin-top:14px">
    <div><p class="lbl">Money, as they handle it</p><p class="look">${c.mny}</p></div>
    <div><p class="lbl">Their edges — what angers, what gets forgiven</p><p class="look">${c.edg}</p></div>
  </div>
  <p class="lbl" style="margin-top:14px">When nobody's watching</p><p class="look">${c.aln}</p>
  <div class="grid2" style="margin-top:14px">
    <div><p class="lbl">A good day / a bad day</p>
      <table class="rout"><tr><td>good</td><td>${c.day[0]}</td></tr><tr><td>bad</td><td>${c.day[1]}</td></tr></table></div>
    <div><p class="lbl">Things they keep</p><ul class="mann">${c.keep.map(k=>`<li>${k}</li>`).join("")}</ul></div>
  </div>
  <div class="grid2" style="margin-top:14px">
    <div><p class="lbl">How they listen</p><p class="look">${c.lst}</p></div>
    <div><p class="lbl">The day off</p><p class="look">${c.offd}</p></div>
  </div>
  <p class="lbl" style="margin-top:14px">How they say sorry — and take one</p><p class="look">${c.rpr}</p>
  <p class="lbl" style="margin-top:14px">A day in the life</p>
  <table class="rout">${c.rout.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>
  <div class="locked"><div class="lk">◼ ◼ ◼</div>
    <p><b>The rest is theirs.</b> Every character has a private life the feed doesn't show —
    it isn't a paid unlock; it simply isn't in this schema. Watch long enough and you'll
    figure out what the street hasn't. That's the show.</p></div>`;
}
CAST.forEach((c,i)=>{
  const b=document.createElement("button");b.className="who"+(i===0?" on":"");
  b.innerHTML=`<span class="init">${c.init}</span><span><span class="nm">${c.name}</span><br><span class="rl">${c.arch}</span></span>`;
  b.onclick=()=>{document.querySelectorAll(".who").forEach(x=>x.classList.remove("on"));b.classList.add("on");render(c)};
  rail.appendChild(b);
});
const rn=document.createElement("div");rn.className="railnote";
rn.textContent="20 more neighbors live ambient lives alongside the cast — porters, dog-walkers, kids, night-shift regulars.";
rail.appendChild(rn);
render(CAST[0]);
