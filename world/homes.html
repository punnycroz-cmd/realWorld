<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Real World — The Fridge Door (household layer)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Household-layer demo — "The Fridge Door" (world v101). Internal posture tool.
  Self-contained: file://-safe, no network. Machine source: world/homes.json
  (mirrored inline below as HOMES — hand-synced, deep-compared by audit.js
  homes gate). Shows what each registry unit is like to live inside —
  occupants, shape, rota, kitchen rhythm, quiet hours, guest norms, the
  house kit, one fridge-note voice line — plus the perks table (what every
  jobs.json employer sends home). Vacant units render showing texture only.
  Norms are CONDITIONS, never scripts. No dollar figures, no secrets.
  INTERNAL tier — the fridge note is the only spectator-safe field.
-->
<style>
  :root{
    --bg:#14171c; --panel:#1c2129; --panel2:#232a34; --ink:#e8e4da;
    --dim:#9a927f; --line:#333c48; --acc:#e0b34c; --grn:#5fae7f;
    --blu:#6ea8d4; --pink:#d48bb0; --org:#d98e5f;
    --paper:#f2ead2; --paper-ink:#4a4231;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font:13.5px/1.5 'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .logo{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px}
  .logo span{color:var(--acc)}
  .tgl{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--dim);flex-wrap:wrap}
  .tgl button{font:inherit;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:9px;
    padding:3px 10px;background:var(--panel2);color:var(--dim);cursor:pointer}
  .tgl button.on{color:var(--acc);border-color:var(--acc)}
  .tier{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  main{max-width:1280px;margin:0 auto;padding:16px 18px}
  h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
  .card{background:#20242c;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .card.vacant{opacity:.8;border-style:dashed}
  .chead{padding:8px 13px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .chead b{font-family:var(--mono);font-size:12.5px;color:var(--acc);letter-spacing:.04em}
  .chip{font-family:var(--mono);font-size:9.5px;border:1px solid var(--line);border-radius:8px;padding:1px 7px;color:var(--blu)}
  .chip.vac{color:var(--dim);border-style:dashed}
  .occ{margin-left:auto;font-size:10px;color:var(--grn);font-family:var(--mono)}
  .cbody{padding:8px 13px;font-size:11.5px}
  .f{padding:2.5px 0}
  .f b{color:var(--org);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
  .note{margin:8px 0 2px;display:flex;justify-content:center}
  .paper{background:var(--paper);color:var(--paper-ink);font-family:'Segoe Print','Bradley Hand',cursive;
    font-size:13px;padding:10px 16px 12px;border-radius:2px;max-width:88%;transform:rotate(-1.4deg);
    box-shadow:0 3px 8px rgba(0,0,0,.4);position:relative}
  .paper::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#e87,#a33);transform:translateX(-50%);box-shadow:0 2px 3px rgba(0,0,0,.4)}
  .nonote{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:center;margin:8px 0 2px}
  .showing{color:var(--dim);font-size:11.5px;padding:4px 0}
  .pk{display:flex;flex-direction:column;gap:6px}
  .p{display:flex;gap:10px;align-items:baseline;padding:7px 12px;background:#20242c;border:1px solid var(--line);border-radius:7px;font-size:12px}
  .p .emp{font-weight:700;color:var(--blu);min-width:200px}
  .p .bring{color:var(--ink)}
  .p .pn{color:var(--dim);font-size:10.5px}
</style>
</head>
<body>
<header>
  <div class="logo">REAL <span>WORLD</span> · The Fridge Door</div>
  <div class="tgl" id="flt">shape:
    <button data-s="all" class="on">all</button>
    <button data-s="solo">solo</button>
    <button data-s="couple">couple</button>
    <button data-s="share">share</button>
    <button data-s="owner">owner</button>
    <button data-s="ambient">ambient</button>
    <button data-s="vacant">vacant</button>
  </div>
  <div class="tier" id="tier"></div>
</header>
<main>
  <h2>Occupied homes — the domestic layer</h2>
  <div class="grid" id="homes"></div>
  <h2>Vacant — the showing</h2>
  <div class="grid" id="vac"></div>
  <h2>The ambient ring</h2>
  <div class="grid"><div class="card"><div class="cbody showing" id="ring"></div></div></div>
  <h2>What work sends home — the perks table</h2>
  <div class="pk" id="perks"></div>
</main>

   "kit": "The lending library of the whole block: every tool that ever went missing from anyone's project is probably here, and Victor knows who has what and when it's due back.",
   "fridge_note": "parts for the 9457 radiator in the back room — WRITE UP THE TICKET. tuesday list on the bench."
  }
 ],
 "vacant": [
  {
   "unit_id": "bld-g9418-B",
   "address": "9418 Guerrero St, Unit B",
   "showing": "The lower flat shows clean and faintly of paint — Carmen waters the stoop plant out of habit even though nobody lives there. The showing trick is the kitchen window over the shared garden; every viewing lingers there."
  },
  {
   "unit_id": "bld-g9457-2",
   "address": "9457 Guerrero St, Unit 2",
   "showing": "Shows honest — small, middle-flat dim, and the stair runs right past the door so you hear the building breathe. Agents sell it as 'the pink building for under market' and let the bay-window flat upstairs do the dreaming."

  {
   "unit_id": "bld-c9127-A",

   "showing": "Best-lit studio in the building — morning sun, a view of the palm across the street. The showing script is short: it's a studio, it has a closet that isn't a lie, the rent is the rent."

 ],
 "ambient_ring": {
  "note": "Ambient cast live one ring out from the park, off-registry — house shares, SRO rooms, a basement in-law, one lucky rent-control holdover. No unit_ids, no addresses, no fridge notes: a promotion mints a real address per address spec §6 and adds a homes row here first."
 },
 "perks": [

  { "employer": "Taqueria El Farolote", "brings_home": "the 3pm family meal, and labeled quarts of rice and beans", "note": "a cook's fridge is a pantry extension — Tomás's quart-container rule is the household law" },
  { "employer": "Flying Pannier Courier Co-op", "brings_home": "tube swaps and the communal parts bin", "note": "the perk is mechanical — Marcus's floor pump is already doing a second tour at 9457" },

 "rules": [
  "SURFACE knowledge only — a roommate or regular visitor could say every word; secrets and seeds live in bibles, never here",
  "conditions, never scripts — rota/quiet/guests are norms that fray; nothing obliges anyone to do dishes",

const $=s=>document.querySelector(s);
document.getElementById('tier').textContent='INTERNAL tier — fridge notes are the only spectator-safe field · homes v'+HOMES.version;

let shape='all';
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function card(h){
  const el=document.createElement('div');
  el.className='card'+(h.shape==='ambient'?'':'')+(h.shape==='vacant'?' vacant':'');
  el.innerHTML=`<div class="chead"><b>${esc(h.address)}</b><span class="chip">${h.shape}</span>
    <span class="occ">${h.occupants.map(esc).join(' + ')}</span></div>
    <div class="cbody">
      <div class="f"><b>rota</b>${esc(h.rota)}</div>
      <div class="f"><b>kitchen</b>${esc(h.kitchen)}</div>
      <div class="f"><b>quiet</b>${esc(h.quiet)}</div>
      <div class="f"><b>guests</b>${esc(h.guests)}</div>
      <div class="f"><b>kit</b>${esc(h.kit)}</div>
      ${h.fridge_note?`<div class="note"><div class="paper">${esc(h.fridge_note)}</div></div>`
                    :`<div class="nonote">— no fridge note: nobody knows them well enough to read it —</div>`}
    </div>`;
  return el;
}
function render(){
  const g=$('#homes'); g.innerHTML='';
  HOMES.homes.filter(h=>shape==='all'||h.shape===shape).forEach(h=>g.appendChild(card(h)));
  const v=$('#vac'); v.innerHTML='';
  HOMES.vacant.forEach(u=>{
    if(shape!=='all'&&shape!=='vacant')return;
    const el=document.createElement('div'); el.className='card vacant';
    el.innerHTML=`<div class="chead"><b>${esc(u.address)}</b><span class="chip vac">vacant · listed</span></div>
      <div class="cbody showing"><b style="color:var(--org)">showing </b>${esc(u.showing)}</div>`;
    v.appendChild(el);
  });
  $('#ring').textContent=HOMES.ambient_ring.note;
}
document.getElementById('flt').addEventListener('click',e=>{
  if(!e.target.dataset.s)return;
  shape=e.target.dataset.s;
  document.querySelectorAll('#flt button').forEach(b=>b.classList.toggle('on',b===e.target));
  render();
});
const pk=$('#perks');
HOMES.perks.forEach(p=>{
  const el=document.createElement('div'); el.className='p';
  el.innerHTML=`<span class="emp">${esc(p.employer)}</span><span class="bring">${esc(p.brings_home)}</span><span class="pn">${esc(p.note)}</span>`;
  pk.appendChild(el);
});
render();
</script>
</body>
