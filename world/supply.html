<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Real World — The Back Door (supply layer)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Supply-layer demo — "The Back Door" (world v86). Internal posture tool.
  Self-contained: file://-safe, no network. Machine source: world/suppliers.json
  (mirrored inline below as SUP — hand-synced, deep-compared by audit.js supply
  gate). Shows the offstage wholesale/trade suppliers and their delivery runs:
  which truck, which door, which window — plus coverage (every door venue fed)
  and the feed-legible street texture. Suppliers are offstage by contract:
  no door, no POI, no cast staff, parody names only (suppliers.md §1).
  Boundaries: runs are CONDITIONS, never scripts — a run can be late or missed.
  No prices anywhere in supply copy. Everything here is spectator-legible
  street texture — a truck on the curb is public.
-->
<style>
  :root{
    --bg:#14171c; --panel:#1c2129; --panel2:#232a34; --ink:#e8e4da;
    --dim:#9a927f; --line:#333c48; --acc:#e0b34c; --grn:#5fae7f;
    --blu:#6ea8d4; --pink:#d48bb0; --org:#d98e5f;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font:13.5px/1.5 'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .logo{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px}
  .logo span{color:var(--acc)}
  .clock{font-family:var(--mono);font-size:15px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 14px}
  .clock small{color:var(--dim);font-size:10.5px}
  .tgl{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--dim);flex-wrap:wrap}
  .tgl button{font:inherit;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:9px;
    padding:3px 10px;background:var(--panel2);color:var(--dim);cursor:pointer}
  .tgl button.on{color:var(--acc);border-color:var(--acc)}
  input[type=range]{width:200px;accent-color:var(--acc)}
  main{max-width:1280px;margin:0 auto;padding:16px 18px}
  h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .runs{display:flex;flex-direction:column;gap:6px}
  .run{display:flex;gap:10px;align-items:baseline;padding:7px 12px;background:#20242c;border:1px solid var(--line);border-radius:7px;font-size:12px}
  .run.live{border-color:var(--grn);background:#1f2a22}
  .run .wh{font-family:var(--mono);color:var(--acc);font-size:11px;min-width:86px}
  .run .sup{font-weight:700;color:var(--blu);min-width:170px}
  .run .ven{color:var(--org);min-width:170px}
  .run .drop{color:var(--ink)}
  .run .note{color:var(--dim);font-size:11px}
  .run .state{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap}
  .run.live .state{color:var(--grn);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .scard{background:#20242c;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .scard.active{border-color:var(--grn)}
  .shead{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .shead b{font-family:var(--mono);font-size:12.5px;color:var(--acc);letter-spacing:.05em}
  .shead .kind{font-size:10.5px;color:var(--dim)}
  .sbody{padding:8px 13px;font-size:11.5px}
  .sbody .veh{color:var(--blu);font-style:italic}
  .sbody .base{color:var(--dim);font-size:11px}
  .sbody .snote{color:var(--dim);font-size:11px;margin-top:4px;border-top:1px dashed var(--line);padding-top:4px}
  .sruns{margin:6px 0 0;padding:0;list-style:none}
  .sruns li{font-size:11px;color:var(--dim);padding-left:12px;position:relative;font-family:var(--mono)}
  .sruns li::before{content:"→";position:absolute;left:0;color:var(--acc)}
  .sruns li.today{color:var(--ink)}
  .cov{display:flex;flex-wrap:wrap;gap:6px}
  .door{font-family:var(--mono);font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:9px;color:var(--dim)}
  .door.fed{color:var(--grn);border-color:var(--grn)}
  .door.exempt{color:var(--acc);border-color:var(--acc)}
  .door.bare{color:#d46a6a;border-color:#d46a6a}
  .tex li{font-size:12px;color:var(--dim);margin:3px 0}
  .feedlines{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  .feedlines div{padding:3px 0;border-bottom:1px dashed var(--line)}
  .feedlines .k{color:var(--pink)}
  .rules{font-size:11.5px;color:var(--dim)}
  .rules li{margin:3px 0}
</style>
</head>

 side"}, "maliks": {"name": "Malik's Mini Mart", "tier": "street", "hours": {"weekday": [7, 23], "weekend": [8, 24]}, "corner": "Guerrero corner"}, "las-palmas": {"name": "Frutería Las Palmas", "tier": "street", "hours": {"weekday": [8, 18], "weekend": [8, 18]}, "corner": "Dolores at 19th (stand)"}, "bloom-and-doom": {"name": "Bloom & Doom Flowers", "tier": "street", "hours": {"weekday": [9, 18], "weekend": [10, 16]}, "corner": "24th side"}, "golden-hour": {"name": "Golden Hour Laundromat", "tier": "street", "hours": {"weekday": [7, 23], "weekend": [7, 23]}, "corner": "Mission St side, orange awning"}, "dusty-spine": {"name": "The Dusty Spine", "tier": "street", "hours": {"weekday": [11, 19], "weekend": [10, 20]}, "corner": "Valencia at 20th side"}, "marooned": {"name": "Marooned Records", "tier": "street", "hours": {"weekday": [11, 19], "weekend": [11, 20]}, "corner": "Valencia side"}, "the-musket": {"name": "The Musket", "tier": "street", "hours": {"weekday": [17, 23], "weekend": [15, 24]}, "corner": "Valencia at 23rd side"}};
const DAYS=['mon','tue','wed','thu','fri','sat','sun'];
const DAYNAME={mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday',sun:'Sunday'};
const WTYPE=d=>(d==='sat'||d==='sun')?'weekend':'weekday';
const S={day:'thu',h:8};
const fmt=h=>{const hh=Math.floor(h)%24,mm=Math.round((h%1)*60);return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');};
const win=r=>r.days==='daily'?null:r.days;

function venueHours(v,d){
  const h=(v.hours||{})[WTYPE(d)];
  if(!h)return null;
  const days=(v.hours||{}).days;
  if(days&&!days.includes(d))return null;
  return h;
}
/* a run lands if its window intersects [open-3, close] on this day */
function lands(r,d){
  return r.to.some(id=>{
    const h=venueHours(DOORS[id],d);
    return h&&r.hours[1]>=h[0]-3&&r.hours[0]<=h[1];
  });
}
function todayRuns(d){
  return SUP.runs.filter(r=>r.days.includes(d)&&lands(r,d))
    .sort((a,b)=>a.hours[0]-b.hours[0]);
}
function runState(r){
  const[a,b]=r.hours;
  if(S.h>=a&&S.h<=b)return'OUT NOW';
  if(S.h<a)return'at '+fmt(a);
  return'done '+fmt(b);
}
function render(){
  document.getElementById('clk').textContent=fmt(S.h%24===0&&S.h>0?S.h:S.h);
  document.getElementById('dow').textContent=DAYNAME[S.day];
  document.getElementById('dayName').textContent=DAYNAME[S.day];
  document.querySelectorAll('#days button').forEach(b=>b.classList.toggle('on',b.dataset.d===S.day));

  const rs=todayRuns(S.day);
  document.getElementById('runs').innerHTML=rs.length?rs.map(r=>{
    const live=S.h>=r.hours[0]&&S.h<=r.hours[1];
    return`<div class="run${live?' live':''}">
      <span class="wh">${fmt(r.hours[0])}–${fmt(r.hours[1])}</span>
      <span class="sup">${SUP.suppliers[r.supplier].name}</span>
      <span class="ven">${r.to.map(id=>DOORS[id].name).join(', ')}</span>
      <span class="drop">${r.drop}</span>
      <span class="state">${runState(r)}</span></div>
      ${r.note?`<div class="run" style="border-top:none;padding-top:0"><span class="note">— ${r.note}</span></div>`:''}`;
  }).join(''):'<div class="run"><span class="note">no runs today — the trucks stay in their sheds</span></div>';

  const fed=new Set(SUP.runs.flatMap(r=>r.to));
  document.getElementById('cov').innerHTML=Object.keys(DOORS).map(id=>{
    const ex=SUP.exempt[id];
    const cls=ex?'exempt':(fed.has(id)?'fed':'bare');
    const tag=ex?'exempt':(fed.has(id)?'fed':'BARE');
    return`<span class="door ${cls}" title="${ex||''}">${id} · ${tag}</span>`;
  }).join('');

  document.getElementById('suppliers').innerHTML=Object.entries(SUP.suppliers).map(([id,s])=>{
    const myRuns=SUP.runs.filter(r=>r.supplier===id);
    const active=myRuns.some(r=>r.days.includes(S.day)&&lands(r,S.day)&&S.h>=r.hours[0]&&S.h<=r.hours[1]);
    return`<div class="scard${active?' active':''}">
      <div class="shead"><b>${s.name}</b><span class="kind">${s.kind}</span></div>
      <div class="sbody">
        <div class="veh">${s.vehicle}</div>
        <div class="base">${s.base}</div>
        <ul class="sruns">${myRuns.map(r=>`<li class="${r.days.includes(S.day)?'today':''}">${r.to.join(', ')} · ${r.days.join('/')} ${fmt(r.hours[0])}–${fmt(r.hours[1])}</li>`).join('')}</ul>
        <div class="snote">${s.note}</div>
      </div></div>`;
  }).join('');

  document.getElementById('tex').innerHTML=SUP.street_texture.map(t=>`<li>${t}</li>`).join('');
  document.getElementById('feed').innerHTML=SUP.feed_shapes.lines.map(l=>`<div><span class="k">[${SUP.feed_shapes.kind}]</span> ${l}</div>`).join('');
  document.getElementById('rules').innerHTML=SUP.rules.map(r=>`<li>${r}</li>`).join('');
}
const dayBox=document.getElementById('days');
DAYS.forEach(d=>{const b=document.createElement('button');b.dataset.d=d;b.textContent=d;b.onclick=()=>{S.day=d;render();};dayBox.appendChild(b);});
document.getElementById('scrub').oninput=e=>{S.h=+e.target.value;render();};
render();
</script>
