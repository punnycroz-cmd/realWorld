<head>
<meta charset="utf-8">
<title>Real World — The Permit Wall (paper layer)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Paper-layer demo — "The Permit Wall" (world v100). Internal posture tool.
  Self-contained: file://-safe, no network. Machine source: world/permits.json
  (mirrored inline below as PERM — hand-synced, deep-compared by the audit.js
  perm gate). Shows the framed paper behind every door venue's counter —
  licenses, score cards, permits — plus the door's lineage: former tenants
  and the ghost sign the facade still carries.
  Boundaries: doors only (offstage orgs and reserved names have no wall);
  agency names are civic facts and stay real; every business name is parody
  or invented; papers carry no people, no prices, no credit figures;
  pending = an application receipt taped up — a condition, never a script.
-->
<style>
  :root{
    --bg:#14171c; --panel:#1c2129; --panel2:#232a34; --ink:#e8e4da;
    --dim:#9a927f; --line:#333c48; --acc:#e0b34c; --grn:#5fae7f;
    --blu:#6ea8d4; --pink:#d48bb0; --org:#d98e5f;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font:13.5px/1.5 'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .logo{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px}
  .logo span{color:var(--acc)}
  .tgl{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--dim);flex-wrap:wrap}
  .tgl button{font:inherit;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:9px;
    padding:3px 10px;background:var(--panel2);color:var(--dim);cursor:pointer}
  .tgl button.on{color:var(--acc);border-color:var(--acc)}
  main{max-width:1280px;margin:0 auto;padding:16px 18px}
  h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .legend{display:flex;flex-wrap:wrap;gap:6px}
  .pk{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border:1px solid var(--line);border-radius:9px;color:var(--dim)}
  .pk b{color:var(--blu);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
  .wall{background:#20242c;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .wall.pend{border-color:var(--org)}
  .whead{padding:9px 13px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .whead b{font-family:var(--mono);font-size:12.5px;color:var(--acc);letter-spacing:.05em}
  .whead .tier{font-size:10.5px;color:var(--dim)}
  .whead .corner{font-size:10.5px;color:var(--dim);margin-left:auto}
  .papers{margin:0;padding:8px 13px;list-style:none}
  .papers li{font-size:11.5px;padding:4px 0 4px 16px;position:relative;border-bottom:1px dashed var(--line)}
  .papers li:last-child{border-bottom:none}
  .papers li::before{content:"▤";position:absolute;left:0;color:var(--dim)}
  .papers .kind{font-family:var(--mono);font-size:10px;color:var(--blu)}
  .papers .st{font-family:var(--mono);font-size:9.5px;padding:1px 7px;border-radius:8px;margin-left:6px}
  .st.posted{color:var(--dim);border:1px solid var(--line)}
  .st.renewed{color:var(--grn);border:1px solid var(--grn)}
  .st.pending{color:var(--org);border:1px solid var(--org)}
  .ghost{padding:7px 13px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px}
  .ghost .tag{color:var(--pink);font-size:9.5px;letter-spacing:.1em}
  .ghost .sign{color:#c9b98a;letter-spacing:.18em;text-shadow:0 0 6px #3a3324}
  .ghost .none{color:var(--dim);font-style:italic}
  .former{margin:0;padding:6px 13px 10px;list-style:none}
  .former li{font-size:11px;color:var(--dim);padding-left:14px;position:relative}
  .former li::before{content:"←";position:absolute;left:0;color:var(--pink)}
  .former b{color:var(--ink);font-weight:600}
  .former .yr{font-family:var(--mono);color:var(--pink);font-size:10px}
  .rules{font-size:11.5px;color:var(--dim)}
  .rules li{margin:3px 0}
  .stat{font-family:var(--mono);font-size:11px;color:var(--dim)}
</style>
</head>

  const ids=Object.keys(PERM.walls);
  const nPapers=ids.reduce((n,id)=>n+PERM.walls[id].papers.length,0);
  const nPend=ids.filter(id=>pend(PERM.walls[id])).length;
  const nGhost=ids.filter(id=>PERM.walls[id].ghost_sign).length;
  document.getElementById('stat').textContent=
    ` · ${ids.length} doors · ${nPapers} papers · ${nPend} pending · ${nGhost} ghost signs`;

  document.getElementById('walls').innerHTML=ids.filter(id=>show(id,PERM.walls[id])).map(id=>{
    const w=PERM.walls[id],d=DOORS[id]||{name:id,tier:'?',corner:''};
    return`<div class="wall${pend(w)?' pend':''}">
      <div class="whead"><b>${d.name}</b><span class="tier">${d.tier}</span><span class="corner">${d.corner}</span></div>
      <ul class="papers">${w.papers.map(p=>{
        const st=p.status||'posted';
        return`<li><span class="kind">${p.kind}</span><span class="st ${st}" title="${STITLE[st]}">${st}</span><br>${p.text}</li>`;
      }).join('')}</ul>
      <div class="ghost"><span class="tag">GHOST SIGN</span> ${w.ghost_sign?`<span class="sign">${w.ghost_sign}</span>`:'<span class="none">no wall to paint — the sign lives nowhere</span>'}</div>
      <ul class="former">${w.former.map(f=>`<li><b>${f.name}</b> <span class="yr">${f.years}</span> — ${f.note}</li>`).join('')}</ul>
    </div>`;
  }).join('');

  document.getElementById('legend').innerHTML=Object.entries(PERM.paper_keys)
    .map(([k,v])=>`<span class="pk"><b>${k}</b> · ${v}</span>`).join('');
  document.getElementById('rules').innerHTML=Object.entries(PERM.rules)
    .map(([k,v])=>`<li><b>${k}</b> — ${Array.isArray(v)||typeof v!=='string'?JSON.stringify(v):v}</li>`).join('');
}
document.querySelectorAll('#flt button').forEach(b=>b.onclick=()=>{
  S.f=b.dataset.f;
  document.querySelectorAll('#flt button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
render();
</script>
</body>
</html>
