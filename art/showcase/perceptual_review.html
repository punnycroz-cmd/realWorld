<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Natura Perceptual Review - Phase 15</title>
<style>
  body { background: #1a1a24; color: #f0f4f8; font-family: monospace; padding: 20px; }
  h1 { color: #dda078; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  .card { background: #26262e; border: 1px solid #454854; padding: 10px; border-radius: 4px; text-align: center; }
  .sprite-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
  canvas { image-rendering: pixelated; border: 1px dashed #545563; }
  .label { font-size: 10px; color: #abb2c7; text-transform: uppercase; }
  .score { color: #a8d4b2; font-weight: bold; margin-top: 5px; }
</style>
</head>
<body>
  <h1>Natura Perceptual Review</h1>
  <p>Evaluating high-fidelity generated outputs against perceptual metrics.</p>
  <div class="grid" id="container"></div>

  <script src="../character_dna.js"></script>
  <script src="../visual_primitives.js"></script>
  <script src="../animation_system.js"></script>
  <script src="../character_generator.js"></script>
  <script>
    fetch('../reference_library/high_fidelity_references.json').then(r => r.json()).then(refData => {
      fetch('../perceptual_report.json').then(r => r.json()).then(report => {
        const container = document.getElementById('container');
        
        report.details.forEach((res, i) => {
          const ref = refData.characters.find(c => c.id === res.id);
          if (!ref) return;

          const dna = new CharacterDNA({
            id: ref.id,
            ageYears: ref.anatomy.agePhase === 'child' ? 5 : (ref.anatomy.agePhase === 'elder' ? 65 : 30),
            face: { skinRampKey: ref.face.skinTone, mouthShape: 'neutral', noseGeometry: 'straight', eyeShape: 'normal' },
            hair: { style: ref.hair.style, colorRampKey: ref.hair.color },
            clothing: { archetype: ref.clothing.family.split('-')[0], layers: { trousersOrSkirt: 'trousers', footwear: 'boots' } },
            palette: { shirt: '#35633f', pants: '#25395c', boots: '#422810' },
            anatomy: { heightScale: 1.0, widthScale: 1.0, shoulderWidth: 10 },
            condition: { wetness: ref.condition === 'wet' ? 1.0 : 0 }
          });

          const cNative = CharacterGenerator.renderFrame(dna, 0, 'idle', 0);
          
          // Render at 4x
          const c4x = document.createElement('canvas');
          c4x.width = 128; c4x.height = 192;
          const ctx4x = c4x.getContext('2d');
          ctx4x.imageSmoothingEnabled = false;
          ctx4x.drawImage(cNative.toCanvas(), 0, 0, 128, 192);

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="label">${ref.id}</div>
            <div class="sprite-container">
              <div>
                ${cNative.toCanvas().outerHTML}
                <div class="label">1x</div>
              </div>
              <div>
                <img src="${c4x.toDataURL()}" style="width: 128px; height: 192px;">
                <div class="label">4x</div>
              </div>
            </div>
            <div class="score">Score: ${(res.score * 100).toFixed(0)}%</div>
          `;
          container.appendChild(card);
        });
      });
    });
  </script>
</body>
</html>
